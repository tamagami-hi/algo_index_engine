[package]
name = "algo_index_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenv = "0.15.0"
futures-util = "0.3.34"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "query", "rustls", "charset", "http2", "gzip"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["full"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
time = { version = "0.3.55", features = ["parsing", "macros"] }
tempfile = "3.27"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
