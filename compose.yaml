services:
  engine:
    build: .
    image: blackbox_trage:latest
    container_name: blackbox_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BLACKBOX_HOME: /app
    volumes:
      - engine-data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  engine-data:
