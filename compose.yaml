services:
  engine:
    build: .
    image: algo-index-engine:latest
    container_name: algo_index_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BLACKBOX_HOME: /app
      BLACKBOX_HTTP_ADDR: 0.0.0.0:8081
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - engine-data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  engine-data:
