services:
  engine:
    build: .
    image: algo-index-engine:latest
    container_name: algo_index_engine
    restart: unless-stopped
    env_file:
      - ${BLACKBOX_ENV_FILE:-.env}
    environment:
      BLACKBOX_HOME: /app
      BLACKBOX_HTTP_ADDR: 0.0.0.0:${BLACKBOX_HTTP_PORT:?Set BLACKBOX_HTTP_PORT in .env}
    ports:
      - "127.0.0.1:${BLACKBOX_HTTP_PORT:?Set BLACKBOX_HTTP_PORT in .env}:${BLACKBOX_HTTP_PORT:?Set BLACKBOX_HTTP_PORT in .env}"
    volumes:
      - engine-data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  engine-data:
