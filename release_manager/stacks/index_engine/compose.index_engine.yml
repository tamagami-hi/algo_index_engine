# ─────────────────────────────────────────────────────────────────────────────
# The DEPLOYED compose file. Runs on the VPS only.
#
# No build: stanza on purpose. The engine image arrives as a tarball and is loaded
# by the native deploy script, so a build here would be both impossible (no source
# on the VPS) and a way to silently ship something other than what was tested.
#
# BB_VERSION is exported by the native deploy script and must resolve to the
# release being deployed. Compose fails on an unset variable rather than
# defaulting, so a missing export cannot start the wrong image.
#
# NO WEB SERVICE. This host already serves BOE_APP from nginx on 80/443, so a
# Caddy container here would fail to bind and break every deploy. The engine
# publishes its HTTP port on loopback only, matching the convention the other
# stacks on this box follow, so the existing host nginx can proxy it if and when
# this engine is given a hostname.
# ─────────────────────────────────────────────────────────────────────────────
services:
  engine:
    image: algo-index-engine:${BB_VERSION:?BB_VERSION must be set by the deploy script}
    container_name: aie-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BLACKBOX_HOME: /app
      BLACKBOX_HTTP_ADDR: 0.0.0.0:8081
    ports:
      - "127.0.0.1:47601:8081"
    volumes:
      - engine-data:/app/data
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  engine-data:
    name: algo_index_engine_data
