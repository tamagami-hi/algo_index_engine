# ─────────────────────────────────────────────────────────────────────────────
# index.algo.boe.internal — the algo index engine's own hostname.
#
# INSTALL TO:  /etc/nginx/sites-available/algo-index-engine
#              then: ln -s /etc/nginx/sites-available/algo-index-engine \
#                          /etc/nginx/sites-enabled/algo-index-engine
# REQUIRES:    map $http_upgrade $connection_upgrade  in the http context
#              (already present on this box for tickvault)
# THEN:        sudo nginx -t && sudo systemctl reload nginx
#              Reload, never restart: a restart drops every in-flight SSE stream.
#
# The release manager stages this file and prints the exact commands. It never
# writes to /etc/nginx: a bad file there takes down every site on this box at
# once, including ones this pipeline does not own.
#
# ── WHAT THIS SERVES ────────────────────────────────────────────────────────
# One hostname, one origin, one upstream. The engine serves its React interface
# and its JSON API from the same listener, so there is no split to route and no
# CORS to configure: everything goes to the loopback port the engine publishes.
#
# ── DNS ─────────────────────────────────────────────────────────────────────
# MagicDNS does not resolve .internal, so each machine needs a hosts entry.
#
#   On the VPS itself, matching the other .internal names already there:
#     127.0.0.1 index.algo.boe.internal
#
#   On each operator device, pointing at the VPS's tailnet address:
#     100.122.85.101 index.algo.boe.internal
#
# ── WHY PLAIN HTTP, AND WHAT THAT COSTS ─────────────────────────────────────
# .internal is ICANN-reserved, so no public CA will ever certify it. The
# alternatives are a private CA installed on every operator device, or serving
# from the tailnet MagicDNS name, which has a real certificate. This vhost takes
# neither: it serves plain HTTP, and the confidentiality comes from WireGuard
# below it rather than from TLS above it.
#
# That is acceptable here for one specific reason: this surface has no login form
# and no password, so there is no credential to intercept. It is NOT harmless -
# anyone who can reach the tailnet can arm and disarm strategies through it - so
# the guard below is the whole of the access control and is not optional.
#
# If a certificate is ever wanted, serve the engine as a location on the existing
# :443 MagicDNS server block instead and make this name a 301 to it, the way
# admin and monitor already work on this box.
#
# ── THE PORT BELOW IS CHECKED, NOT TRUSTED ──────────────────────────────────
# The stack's env file is the only source of truth for the port: it drives the
# backend listener, the Docker mapping, the browser callback URL and the deploy
# health probe. nginx cannot read that file, so this is the one place the number
# is written a second time.
#
# It is therefore verified rather than trusted. Every deploy resolves the port
# Compose actually publishes and refuses to continue if a proxy_pass here names a
# different one, so a stale vhost cannot leave the interface dead while every
# other check passes. Change BLACKBOX_HTTP_PORT and you change proxy_pass here
# too, in the same commit.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    server_name index.algo.boe.internal;

    # Tailnet devices and the box itself. Everything else is refused, including
    # anything arriving through the Cloudflare tunnel that shares this :80 socket.
    # nginx does not inherit allow/deny from a sibling server block, so this must
    # be stated here even though other vhosts state it too.
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # An option chain payload is ~25 kB of JSON per publish. A request body that
    # size would be a bug, so cap it well below anything the API legitimately takes.
    client_max_body_size 1m;

    access_log /var/log/nginx/algo-index-engine.access.log;
    error_log  /var/log/nginx/algo-index-engine.error.log;

    location / {
        proxy_pass http://127.0.0.1:47601;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The engine streams server-sent events at up to 20 Hz. Buffering them
        # defeats the point: nginx would hold each frame until a buffer filled, so
        # the operator would see market data arrive in bursts and the staleness
        # indicator would misfire on nginx's latency rather than the feed's.
        proxy_buffering off;
        proxy_cache off;
        gzip off;

        # An idle stream sends only keep-alive comments. The read timeout has to
        # outlast the quiet stretches or nginx tears the stream down and the
        # browser spends the session reconnecting.
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;

        # Costs nothing here and means a future websocket surface does not need
        # this file edited under pressure.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
