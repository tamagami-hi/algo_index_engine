# ─────────────────────────────────────────────────────────────────────────────
# engine.boe.app.internal — memorable name for the algo index engine.
# REDIRECT ONLY. This vhost serves no content.
#
# INSTALL TO:  /etc/nginx/sites-available/algo-index-engine
#              then: ln -s /etc/nginx/sites-available/algo-index-engine \
#                          /etc/nginx/sites-enabled/algo-index-engine
# REQUIRES:    algo-index-engine-location.conf included in the MagicDNS :443
#              server block, which is what this redirects to
# CERTIFICATE: none. This block never serves TLS, by design.
# THEN:        sudo nginx -t && sudo systemctl reload nginx
#
# ── WHY A REDIRECT ──────────────────────────────────────────────────────────
# Identical reasoning to monitor.boe.app.internal and admin.boe.app.internal on
# this box: no public CA certifies an ICANN-reserved .internal name, and this
# surface arms trading strategies, so it belongs behind a certificate an operator
# device already trusts. The tailnet MagicDNS name has one. This file only makes
# the address memorable.
#
# ── DNS ─────────────────────────────────────────────────────────────────────
# MagicDNS does not resolve .internal, so each operator device needs a hosts
# entry pointing at the VPS's tailnet address:
#
#     100.122.85.101 engine.boe.app.internal
#
# On the VPS itself point it at loopback, matching the other .internal names
# there, so an on-box curl works:
#
#     127.0.0.1 engine.boe.app.internal
#
# ── WHY THE GUARD IS HERE TOO ───────────────────────────────────────────────
# This block shares the wildcard :80 socket with the Cloudflare-Tunnel vhosts.
# Without the guard, anything that can reach port 80 on any interface could hit
# it by setting the Host header. A redirect leaks little, but it confirms the
# hostname exists and the guard is four lines.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    listen [::]:80;

    server_name engine.boe.app.internal;

    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # $request_uri already starts with "/", so a bookmark of
    # http://engine.boe.app.internal/#/chains lands on the chains page rather
    # than the telemetry default.
    return 301 https://beonedge-vps.tail4ea2bc.ts.net/engine$request_uri;
}
