# ─────────────────────────────────────────────────────────────────────────────
# The algo index engine, served over the tailnet's own HTTPS origin.
#
# INSTALL TO:  /etc/nginx/conf.d/algo-index-engine-location.conf
# INCLUDE IN:  the EXISTING :443 server block for the MagicDNS name
#              (beonedge-vps.tail4ea2bc.ts.net), beside the Grafana location
# REQUIRES:    map $http_upgrade $connection_upgrade  in the http context
#              (already present on this box for tickvault)
# CERTIFICATE: the tailnet certificate already on disk at /etc/nginx/tls/,
#              already renewed by cron. Nothing new to issue.
# THEN:        sudo nginx -t && sudo systemctl reload nginx
#              Never restart: a restart drops every in-flight SSE stream.
#
# ── WHY HERE AND NOT ON A .internal NAME ────────────────────────────────────
# This surface can arm and disarm trading strategies. `.internal` is
# ICANN-reserved, so no public CA will ever certify it, which leaves either plain
# HTTP or a private CA on every operator device. The same reasoning already
# applied to Grafana on this box, and the outcome was the same: put the real
# origin on the tailnet MagicDNS name, which has a genuinely trusted
# certificate, and keep the memorable .internal name as a redirect. See
# algo-index-engine.tailscale.conf for that bookmark.
#
# ── WHY THE GUARD IS REPEATED ───────────────────────────────────────────────
# nginx does not inherit allow/deny into a location from anywhere else, and this
# location is being grafted into a server block that serves other things. Without
# its own guard it inherits whatever that block allows.
# ─────────────────────────────────────────────────────────────────────────────

location /engine/ {
    # Tailnet devices and the box itself. Everything else, including anything
    # arriving through the Cloudflare tunnel, is refused.
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # No trailing slash on proxy_pass: the engine serves its own absolute paths
    # (/api/..., /health) and rewriting the prefix away is what the rewrite below
    # is for. Keeping them separate makes the two decisions visible.
    rewrite ^/engine/(.*)$ /$1 break;
    proxy_pass http://127.0.0.1:47601;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /engine;

    # The engine streams server-sent events. Buffering them defeats the point:
    # nginx would hold each 20 Hz frame until a buffer filled, so the operator
    # would see market data in bursts and staleness detection would misfire.
    proxy_buffering off;
    proxy_cache off;
    gzip off;

    # An idle SSE stream sends only keep-alive comments. The read timeout has to
    # outlast the quiet stretches or nginx tears the stream down and the browser
    # spends the session reconnecting.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    # Upgrade headers cost nothing here and mean a future websocket surface does
    # not need this file edited under pressure.
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}

# The container health check and the deploy script's health gate both probe
# loopback directly, so /health does not need to be reachable through the edge.
# It is allowed here only so an operator on the tailnet can see phase and
# readiness without opening an SSH session.
location = /engine/ready {
    allow 100.64.0.0/10;
    allow 127.0.0.1;
    allow ::1;
    deny all;

    proxy_pass http://127.0.0.1:47601/ready;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
