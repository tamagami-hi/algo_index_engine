services:
  app:
    image: mcr.microsoft.com/devcontainers/rust:1-bookworm
    init: true
    working_dir: /workspaces/blackbox_trage
    command: sleep infinity
    volumes:
      - ..:/workspaces/blackbox_trage:cached
    env_file:
      - postgres.env
      - redis.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - development
      - backend

  postgres:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    env_file:
      - postgres.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend

  redis:
    image: redis:8.10.1-alpine3.23
    restart: unless-stopped
    env_file:
      - redis.env
    command:
      - sh
      - -ec
      - |
        test -n "$${REDIS_PASSWORD}"
        exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${REDIS_PASSWORD} redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - backend

volumes:
  postgres-data:
  redis-data:

networks:
  development:
  backend:
    internal: true
